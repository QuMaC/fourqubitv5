[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fourqubitv5"
version = "0.1.0"
requires-python = ">=3.11"
# Direct deps mirrored from Software/envs/qumac-env (Python 3.11).
# Pinned recreate: environment.yml + requirements-hm-sim.txt → hm-sim-env.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "qutip>=5.0",
    "qutip-qip>=0.4",
    "tqdm>=4.66",
    "dynamiqs>=0.3",
    "jax>=0.4",
    "jaxlib>=0.4",
    "pillow>=10",
    "requests>=2.31",
    "sympy>=1.12",
    "scikit-learn>=1.5",
    "joblib>=1.3",
    "tabulate>=0.9",
    "termcolor>=2.3",
    "cmasher>=1.6",
    "plotly>=5.18",
    "PyVISA>=1.14",
    "qualang-tools>=0.20",
    "qm-qua>=1.1",
    "qm-octave>=2.0",
    "quam>=0.4",
    "dill>=0.3",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.0",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
]

[tool.setuptools.packages.find]
include = [
    "Configuration_Files*",
    "Helper_Functions*",
    "HM*",
    "Automation*",
    "SingleQubit_Characterization*",
    "CrossResonance_Calibrations*",
    "DebuggingTools*",
    "Benchmarking*",
]
exclude = ["HM.data_misc*"]
